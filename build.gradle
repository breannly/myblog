plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '4.1.1'
}

gretty {
    contextPath = '/'
    servletContainer = 'tomcat10'
    httpPort = 8080
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaVersion)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation "org.springframework:spring-webmvc:${springVersion}"

    // Database
    implementation "org.springframework.data:spring-data-jdbc:${springDataVersion}"
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'org.flywaydb:flyway-core:9.21.1'

    // Testing
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // UI
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'
}

tasks.named('test') {
    useJUnitPlatform()
}