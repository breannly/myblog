<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post Detail</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        .post-header {
            padding: 2rem;
            background-color: #1a237e;
            color: white;
            position: relative;
        }

        .post-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background-color: white;
            color: #1a237e;
        }

        .btn-back {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .post-content {
            padding: 2rem;
        }

        .content-text {
            font-size: 1.1rem;
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .post-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin: 1.5rem 0;
        }

        .meta {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
        }

        .meta-item i {
            color: #1a237e;
        }

        .likes i {
            color: #e53e3e;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .post-header h1 {
                font-size: 2rem;
            }

            .button-group {
                flex-direction: column;
            }

            .meta {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="post-header">
        <h1 th:text="${post.title}">Title</h1>
        <div class="button-group">
            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-edit">
                <i class="fas fa-edit"></i> Edit Post
            </a>
            <a href="/posts" class="btn btn-back">
                <i class="fas fa-arrow-left"></i> Back to Posts
            </a>
        </div>
    </div>

    <div class="post-content">
        <p class="content-text" th:text="${post.content}">Content</p>
        <img th:if="${post.imageUrl}" th:src="${post.imageUrl}" alt="Post image" class="post-image"/>

        <div class="meta">
            <div class="meta-item likes">
                <i class="fas fa-heart"></i>
                <span th:text="${post.likesCount}">0</span> likes
            </div>
            <div class="meta-item">
                <i class="far fa-calendar-plus"></i>
                Created:
                <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
            </div>
            <div class="meta-item">
                <i class="far fa-calendar-check"></i>
                Updated:
                <span th:text="${#temporals.format(post.updatedAt, 'dd MMM yyyy HH:mm')}">Date</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
