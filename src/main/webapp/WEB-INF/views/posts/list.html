<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Posts</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }

        h1 {
            color: #1a237e;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #2962ff;
            color: white;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(41, 98, 255, 0.1);
        }

        .btn:hover {
            background-color: #1a237e;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(41, 98, 255, 0.2);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .post-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .post-card h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            line-height: 1.3;
        }

        .post-card h2 a {
            color: #1a237e;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .post-card h2 a:hover {
            color: #2962ff;
        }

        .post-text {
            color: #4a5568;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .post-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #e9ecef;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid #e9ecef;
        }

        .likes {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .likes i {
            color: #e53e3e;
        }

        .date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #718096;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .post-card:nth-child(n) {
            animation-delay: calc(n * 0.1s);
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Posts</h1>
    <a href="/posts/create" class="btn">
        <i class="fas fa-plus"></i>
        Add New Post
    </a>
</div>

<div class="posts-grid">
    <div th:each="post : ${posts}" class="post-card">
        <img th:if="${post.imageUrl}" th:src="${post.imageUrl}" alt="Post image"/>
        <div class="post-content">
            <h2>
                <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Title</a>
            </h2>
            <p class="post-text" th:text="${post.content}">Content</p>
            <div class="post-meta">
                <div class="likes">
                    <i class="fas fa-heart"></i>
                    <span th:text="${post.likesCount}">0</span>
                </div>
                <div class="date">
                    <i class="far fa-calendar-alt"></i>
                    <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
